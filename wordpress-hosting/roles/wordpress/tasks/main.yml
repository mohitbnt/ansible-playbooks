---
- name: Download the wordpress archive
  ansible.builtin.get_url:
    url: "{{ wp_download_url }}"
    dest: "/tmp/wordpress.tar.gz"
    mode: '644'
  

- name: Extract the wordpress setup in document root
  ansible.builtin.unarchive:
    src: "/tmp/wordpress.tar.gz"
    dest: "{{ wp_site_root }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    owner: apache
    group: apache

- name: Configure wp-config.php from Jinja2 template
  ansible.builtin.template:
    src: wp-config.php.j2
    dest: "{{ wp_site_root }}/wp-config.php"
    owner: apache
    group: apache
    mode: '0644'

- name: Fix ownership of wordpress document root
  ansible.builtin.file:
    path: "{{ wp_site_root }}"
    state: directory
    recurse: true
    owner: apache
    group: apache  